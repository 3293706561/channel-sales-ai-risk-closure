  .today-actions{background:#fff;border:1px solid var(--line);border-radius:9px;margin:-4px 0 18px;overflow:hidden}.today-actions header{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-bottom:1px solid var(--line)}.today-actions h2{font-size:15px;margin:0}.today-actions header span{font-size:12px;color:var(--muted)}.action-cards{display:grid;grid-template-columns:repeat(3,1fr)}.action-card{padding:15px 17px;border-right:1px solid #edf0ed;display:flex;gap:11px;align-items:center}.action-card:last-child{border-right:0}.action-index{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#edf7f2;color:var(--forest);font:700 12px Georgia,serif;flex:0 0 auto}.action-card b{display:block;font-size:13px}.action-card small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.action-card button{margin-left:auto;white-space:nowrap}@media(max-width:900px){.action-cards{grid-template-columns:1fr}.action-card{border-right:0;border-bottom:1px solid #edf0ed}.action-card:last-child{border-bottom:0}}
  .war-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.war-head .date{font:12px Georgia,serif;color:var(--muted);letter-spacing:.6px}.war-head h1{font:600 28px/1.1 Georgia,"Microsoft YaHei",serif;margin:4px 0}.war-head p{margin:7px 0 0;color:var(--muted)}.war-grid{display:grid;grid-template-columns:1.45fr .85fr;gap:16px}.priority-case{background:linear-gradient(118deg,#153e34,#215f50);color:#fff;border-radius:12px;padding:25px;min-height:280px;position:relative;overflow:hidden}.priority-case:after{content:"";position:absolute;width:290px;height:290px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-100px;top:-135px}.priority-case .kicker{font-size:11px;letter-spacing:1.5px;color:#b9dccc}.priority-case h2{font:600 26px/1.2 Georgia,"Microsoft YaHei",serif;margin:13px 0 10px;max-width:560px}.priority-case p{color:#d4e8df;max-width:560px;margin:0}.priority-foot{display:flex;align-items:end;justify-content:space-between;margin-top:30px}.priority-number span{display:block;font-size:11px;color:#b9dccc}.priority-number strong{font:600 32px/1 Georgia,serif;display:block;margin-top:5px}.priority-case .primary{background:#f4f8f5;color:#174d40;position:relative;z-index:1}.today-panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.today-panel header{padding:17px 18px 12px;border-bottom:1px solid var(--line)}.today-panel h2{font-size:15px;margin:0}.today-panel p{font-size:12px;color:var(--muted);margin:3px 0 0}.today-item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid #edf0ed}.today-item:last-child{border:0}.today-no{color:var(--amber);font:700 13px Georgia,serif}.today-item b{display:block;font-size:13px}.today-item small{display:block;color:var(--muted);margin-top:2px}.today-item button{padding:6px 9px;font-size:12px}.war-lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.trend-card,.evidence-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.war-card-head{padding:15px 18px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}.war-card-head h2{font-size:15px;margin:0}.war-card-head span{font-size:12px;color:var(--muted)}.clean-chart{height:180px;padding:30px 20px 20px;display:flex;align-items:end;gap:13px}.clean-bar{flex:1;background:#d7e8df;border-radius:3px 3px 0 0;position:relative}.clean-bar.alert{background:var(--amber)}.clean-bar b{position:absolute;top:-20px;width:100%;text-align:center;font:11px Georgia,serif;color:var(--muted)}.clean-bar span{position:absolute;bottom:-21px;width:100%;text-align:center;font-size:10px;color:var(--muted)}.evidence-card .evidence{margin:13px 18px}.evidence-card .evidence:last-child{margin-bottom:18px}@media(max-width:900px){.war-grid,.war-lower{grid-template-columns:1fr}.priority-case{min-height:auto}}

<body>
<div class="shell"><aside class="side"><div class="brand"><div class="mark">澄</div><div><b>澄明</b><small>特渠经营智能管理 · 演示环境</small></div></div><nav class="nav"><div class="nav-label">经营总览</div><button class="active" data-page="dashboard"><i>◈</i>经营驾驶舱</button><button data-page="risks"><i>△</i>风险预警中心</button><div class="nav-label">协同处置</div><button data-page="tasks"><i>□</i>整改任务</button><button data-page="reports"><i>↗</i>AI 经营简报</button></nav><div class="side-note"><b>演示数据说明</b><span>本页面使用模拟数据，不连接企业真实系统。</span></div></aside><main><header class="top"><div class="crumb">澄明 / <strong id="pageName">经营驾驶舱</strong></div><div class="top-right"><span><i class="live"></i>数据更新至 10:30</span><span>特渠销售管理部</span></div></header><div class="view" id="app"></div></main></div>
<div class="mask" id="modal"><div class="modal"><header><b id="modalTitle">风险详情</b><button onclick="closeModal()">×</button></header><div class="content" id="modalContent"></div><footer><button class="secondary" onclick="closeModal()">取消</button><button class="primary" id="modalConfirm">确认</button></footer></div></div></div><div class="toast" id="toast"></div>
<script>
const cases=[
 {id:'north',level:'red',code:'R-032',title:'华北大区月度目标达成风险',summary:'近 7 日出货额持续低于计划，重点项目“政企中秋礼赠”推进停滞。',owner:'李楠 / 华北大区经理',due:'今日 18:00',status:'待确认',impact:'预计影响 86 万元',signals:['近 3 日日均出货额较前一周下降 24%','重点项目已 12 天无有效跟进记录','区域日报中“货期不确定”标签出现 7 次'],advice:'优先核实礼赠项目货期与客户决策节点；确认后由区域经理协调供货与拜访计划，并于今日完成责任人指派。',stage:1},
 {id:'south',level:'yellow',code:'R-027',title:'华南省区重点客户拜访异常',summary:'重点客户有效拜访数本周下降，存在项目跟进断档。',owner:'周敏 / 省区主管',due:'明日 12:00',status:'处理中',impact:'涉及 3 个重点客户',signals:['有效拜访量较个人近四周均值下降 48%','2 个商机超过 7 天未更新','日报提交完整，但缺少下一步计划'],advice:'先与销售确认客户假期节奏和项目状态；将可恢复的拜访计划拆成具体日期与客户联系人。',stage:2},
 {id:'east',level:'yellow',code:'R-019',title:'华东定制礼盒库存匹配风险',summary:'区域预估订单增加，但可售库存不足以覆盖已确认需求。',owner:'陈思 / 供应协同专员',due:'明日 10:00',status:'待确认',impact:'可能影响 2 个项目履约',signals:['预计需求较可售库存高出 1,200 件','2 个项目进入合同确认阶段','供应计划尚未锁定'],advice:'确认订单概率和交期后，发起跨区域调拨或补货评估。',stage:1}
];
let current='dashboard',selected='north',filter='all';const app=document.querySelector('#app'),modal=document.querySelector('#modal'),modalTitle=document.querySelector('#modalTitle'),modalContent=document.querySelector('#modalContent');
function badge(level){return `<span class="pill ${level}">${level==='red'?'严重风险':'一般风险'}</span>`}function getCase(){return cases.find(c=>c.id===selected)}
function dashboard(){return `<div class="headline"><div><h1>先处理能影响本月结果的风险</h1><p>数据预警用于发现与分派；原因判断和销项始终由业务人员确认。</p></div><button class="primary" onclick="go('risks')">进入预警中心</button></div><div class="alert-banner"><i class="pulse"></i><div><b>发现 1 项需要今日确认的经营风险</b><br><span>华北大区的重点项目与出货趋势同时异常，建议优先处理。</span></div><button onclick="openCase('north')">查看风险</button></div><div class="metrics"><div class="metric feature"><label>本月特渠销售达成</label><strong>72.6%</strong><small>较计划进度低 4.1 个百分点 · 需关注华北大区</small></div><div class="metric"><label>待确认风险</label><strong>02</strong><small class="warn">1 项今日到期</small></div><div class="metric"><label>整改处理中</label><strong>01</strong><small>已指派至区域负责人</small></div><div class="metric"><label>本周已关闭</label><strong>06</strong><small>均保留处置留痕</small></div></div><div class="grid"><section class="panel"><div class="panel-head"><h2>优先风险清单</h2><button class="link-btn" onclick="go('risks')">查看全部 →</button></div>${cases.map(c=>`<div class="risk-row"><span class="severity ${c.level}">${c.level==='red'?'!':'△'}</span><div><b>${c.title}</b><small>${c.impact} · ${c.status} · ${c.due}</small></div><button class="link-btn" onclick="openCase('${c.id}')">处置 →</button></div>`).join('')}</section><section class="panel"><div class="panel-head"><h2>华北出货趋势</h2><span>单位：万元 / 日</span></div><div class="chart">${[46,51,48,44,39,33,29].map((n,i)=>`<div class="bar ${i===6?'now':''}" style="height:${n*2}px"><b>${n}</b><span>0${i+1}/0${i+4}</span></div>`).join('')}</div><div class="insight"><div class="insight-box"><b>AI 提示：下降趋势与项目停滞同时出现</b><p>这是基于出货、项目跟进与日报标签的关联提示，不构成自动归因结论。</p></div><ul class="insight-list"><li><span class="dot"></span>重点项目 1 个，12 天未更新</li><li><span class="dot"></span>“货期不确定”日报标签出现 7 次</li></ul></div></section></div>`}
function risks(){const list=cases.filter(c=>filter==='all'||c.level===filter);return `<div class="headline"><div><h1>风险预警中心</h1><p>按规则识别异常；每条预警均需确认、指派和复核，避免“只亮红灯、不产生动作”。</p></div><button class="secondary" onclick="openRule()">查看预警口径</button></div><div class="filter-row"><button class="filter ${filter==='all'?'active':''}" onclick="setFilter('all')">全部 ${cases.length}</button><button class="filter ${filter==='red'?'active':''}" onclick="setFilter('red')">严重风险 1</button><button class="filter ${filter==='yellow'?'active':''}" onclick="setFilter('yellow')">一般风险 2</button></div><table class="table"><thead><tr><th>等级</th><th>预警事项</th><th>发现信号</th><th>责任人</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(c=>`<tr><td>${badge(c.level)}</td><td><b>${c.title}</b><br><small style="color:#6c7772">${c.code} · ${c.impact}</small></td><td>${c.signals[0]}</td><td>${c.owner}</td><td>${c.status==='已关闭'?'<span class="pill green">已关闭</span>':c.status}</td><td><a class="click" onclick="openCase('${c.id}')">查看处置</a></td></tr>`).join('')}</tbody></table>`}
function taskPage(){const assigned=cases.filter(c=>c.status!=='待确认');return `<div class="headline"><div><h1>整改任务</h1><p>任务由预警确认后产生；处置说明与人工复核共同构成闭环证据。</p></div><button class="primary" onclick="openCase('north')">处理优先风险</button></div><table class="table"><thead><tr><th>关联风险</th><th>责任人</th><th>截止时间</th><th>当前环节</th><th>操作</th></tr></thead><tbody>${assigned.length?assigned.map(c=>`<tr><td><b>${c.title}</b><br><small style="color:#6c7772">${c.code}</small></td><td>${c.owner}</td><td>${c.due}</td><td>${c.status}</td><td><a class="click" onclick="openCase('${c.id}')">进入任务</a></td></tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:#6c7772;padding:35px">暂无已指派任务。请先在预警详情中确认风险。</td></tr>`}</tbody></table>`}
function reports(){return `<div class="headline"><div><h1>AI 经营简报</h1><p>系统仅汇总已授权的经营数据与已确认风险；结论需由管理者复核后使用。</p></div><button class="primary" onclick="toast('已生成今日演示简报。')">生成今日简报</button></div><section class="panel"><div class="panel-head"><h2>2026 年 8 月 28 日 · 特渠经营早报</h2><span>演示内容</span></div><div class="insight"><div class="insight-box"><b>今日优先事项：华北大区月度目标达成风险</b><p>出货趋势、项目跟进和日报标签同时出现异常信号；请在今日完成原因核验与责任指派。</p></div><div class="section-title">已确认的经营事实</div><ul class="insight-list"><li>本月特渠销售目标达成 72.6%，低于计划进度 4.1 个百分点。</li><li>华北大区近 3 日日均出货额较前一周下降 24%。</li><li>华南省区重点客户拜访异常正在处理中。</li></ul></div></section>`}
function workspace(){const c=getCase(),steps=['规则命中','经理确认','责任指派','整改执行','人工复核'];return `<div class="headline"><div><div class="eyebrow">风险预警 / ${c.code}</div><h1>${c.title}</h1><p>${c.summary}</p></div><button class="secondary" onclick="go('risks')">← 返回预警中心</button></div><div class="workspace"><aside class="case-list"><h3>当前风险</h3>${cases.map(x=>`<div class="case-item ${x.id===c.id?'active':''}" onclick="openCase('${x.id}')"><b>${x.title}</b><span>${x.status} · ${x.due}</span></div>`).join('')}</aside><section class="case-main"><div class="case-top"><div class="eyebrow">${badge(c.level)}　${c.impact}</div><h2>${c.title}</h2><p>风险结论来自预警规则与关联数据，需由区域经理确认原因与处置动作。</p><div class="steps">${steps.map((s,i)=>`<div class="step ${i<c.stage?'done':i===c.stage?'current':''}">${s}</div>`).join('')}</div></div><div class="case-body"><div class="section-title">系统发现的信号</div>${c.signals.map((s,i)=>`<div class="evidence"><b>${i===0?'核心信号：':'关联线索：'}${s}</b><p>演示中仅展示摘要；真实场景需可回溯来源系统、取数时间及明细记录。</p></div>`).join('')}<div class="ai-note"><h4>AI 处置建议（待业务确认）</h4><p>${c.advice}</p></div><div class="action-row">${c.status==='待确认'?`<button class="secondary" onclick="dismissCase()">标记为误报</button><button class="primary" onclick="assignTask()">确认风险并指派</button>`:c.status==='处理中'?`<button class="secondary" onclick="showProgress()">补充整改进度</button><button class="primary" onclick="submitReview()">提交人工复核</button>`:`<button class="secondary" onclick="showProgress()">查看处置记录</button><button class="primary" onclick="toast('该风险已关闭，完整留痕可供复盘。')">查看复盘</button>`}</div></div></section><aside class="case-aside"><section><h3>任务信息</h3><div class="kv"><span>状态</span><b>${c.status}</b></div><div class="kv"><span>责任人</span><b>${c.owner}</b></div><div class="kv"><span>截止时间</span><b>${c.due}</b></div><div class="kv"><span>预警等级</span><b>${c.level==='red'?'严重':'一般'}</b></div></section><section><h3>处理留痕</h3><div class="timeline"><div>预警规则命中<small>今天 10:30 · 自动生成</small></div><div>关联业务数据<small>销售、项目、日报共 3 类</small></div>${c.status!=='待确认'?'<div>区域经理已确认<small>处置任务已创建</small></div>':''}</div></section><section><h3>边界提示</h3><p style="margin:0;font-size:12px;color:#6c7772">AI 仅提供数据线索与建议，不自动认定责任、不自动关闭任务。</p></section></aside></div>`}
function render(){const names={dashboard:'经营驾驶舱',risks:'风险预警中心',tasks:'整改任务',reports:'AI 经营简报',case:'风险处置'};document.querySelector('#pageName').textContent=names[current];app.innerHTML=current==='dashboard'?dashboard():current==='risks'?risks():current==='tasks'?taskPage():current==='reports'?reports():workspace();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current))}function go(p){current=p;render();window.scrollTo({top:0,behavior:'smooth'})}function setFilter(f){filter=f;go('risks')}function openCase(id){selected=id;go('case')}function openModal(title,body,handler){modalTitle.textContent=title;modalContent.innerHTML=body;document.querySelector('#modalConfirm').onclick=handler;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)}function openRule(){openModal('预警规则说明',`<p>本 MVP 使用模拟规则，真实项目需要以历史数据和业务负责人复核校准。</p><div class="check">当区域连续 3 日出货额低于前一周均值 20%，触发趋势异常。</div><div class="check">当重点项目超过 10 天无有效跟进记录，触发项目停滞异常。</div><div class="check">当两类及以上信号同时命中，升级为人工优先确认项。</div>`,()=>closeModal())}function assignTask(){const c=getCase();openModal('确认风险并创建整改任务',`<p>请确认：系统提供的是数据线索，实际原因需由业务负责人核验。</p><div class="check"><input type="checkbox" checked disabled><div><b>已查看关联数据信号</b><br>出货、项目进度和日报标签均已展示。</div></div><div class="check"><input type="checkbox" id="confirmReason"><div><b>确认需要启动整改</b><br>将指派给 ${c.owner}。</div></div>`,()=>{if(!document.querySelector('#confirmReason').checked){toast('请先确认需要启动整改。');return}c.status='处理中';c.stage=2;closeModal();render();toast('整改任务已创建并通知区域负责人。')})}function showProgress(){openModal('补充整改进度',`<p>请记录已采取的动作、现存阻碍及需要协同的事项。演示环境会保留该操作的提示，不写入企业系统。</p><textarea style="width:100%;height:110px;border:1px solid #d9ded8;padding:10px;font:13px Microsoft YaHei" placeholder="例如：已确认客户决策节点，正在协调货期与拜访计划。"></textarea>`,()=>{closeModal();toast('整改进度已保存，等待人工复核。')})}function submitReview(){const c=getCase();openModal('提交人工复核',`<p>复核人需确认：数据变化是否支持销项；如不支持，应退回继续整改。</p><div class="check"><input type="checkbox" id="review"><div><b>已核验处理后的业务数据</b><br>不以文字说明替代数据与人工判断。</div></div>`,()=>{if(!document.querySelector('#review').checked){toast('请完成数据核验后再提交。');return}c.status='已关闭';c.stage=4;closeModal();render();toast('风险已关闭，处置过程已归档。')})}function dismissCase(){openModal('标记为误报',`<p>误报需要留下原因，用于后续调整规则。此操作不会删除原始预警记录。</p><div class="check"><input type="checkbox" id="false"><div><b>已确认该预警无需处置</b><br>请在真实项目中补充原因分类。</div></div>`,()=>{if(!document.querySelector('#false').checked){toast('请确认误报结论。');return}const c=getCase();c.status='已关闭';c.stage=4;closeModal();render();toast('已标记为误报并保留规则复盘记录。')})}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
const baseRender=render;render=function(){baseRender();if(current!=='dashboard')return;const metrics=document.querySelector('.metrics');if(!metrics)return;metrics.insertAdjacentHTML('afterend',`<section class="today-actions"><header><h2>今天的管理动作</h2><span>先完成这三件事，再看其他数据</span></header><div class="action-cards"><div class="action-card"><span class="action-index">1</span><div><b>确认华北经营风险</b><small>今日到期 · 预计影响 86 万元</small></div><button class="primary" onclick="openCase('north')">去确认</button></div><div class="action-card"><span class="action-index">2</span><div><b>跟进华南整改进度</b><small>已处理 1 天 · 明日中午到期</small></div><button class="secondary" onclick="openCase('south')">去跟进</button></div><div class="action-card"><span class="action-index">3</span><div><b>查看今日经营简报</b><small>已汇总已确认的经营事实</small></div><button class="secondary" onclick="go('reports')">看简报</button></div></div></section>`)};render();
dashboard=function(){return `<div class="war-head"><div><div class="date">2026.08.28 · 特渠经营日报</div><h1>经营作战台</h1><p>今天先确认一个风险，再安排一项整改。</p></div><button class="secondary" onclick="go('reports')">查看今日简报</button></div><div class="war-grid"><section class="priority-case"><div class="kicker">TODAY'S PRIORITY · R-032</div><h2>华北大区：目标达成正在失速</h2><p>出货趋势和重点项目同时异常。先确认真实原因，再决定由谁处理。</p><div class="priority-foot"><div class="priority-number"><span>预计影响</span><strong>86 万元</strong></div><button class="primary" onclick="openCase('north')">开始处理 →</button></div></section><section class="today-panel"><header><h2>今天要完成的事</h2><p>按优先级完成，不需要先看所有数据。</p></header><div class="today-item"><span class="today-no">01</span><div><b>确认华北经营风险</b><small>今日 18:00 前 · 需要区域经理判断</small></div><button class="link-btn" onclick="openCase('north')">处理</button></div><div class="today-item"><span class="today-no">02</span><div><b>跟进华南整改进度</b><small>已有任务在处理中 · 明日中午到期</small></div><button class="link-btn" onclick="openCase('south')">查看</button></div><div class="today-item"><span class="today-no">03</span><div><b>确认华东库存风险</b><small>两个项目即将进入合同确认阶段</small></div><button class="link-btn" onclick="openCase('east')">查看</button></div></section></div><div class="war-lower"><section class="trend-card"><div class="war-card-head"><h2>华北近 7 日出货趋势</h2><span>万元 / 日</span></div><div class="clean-chart">${[46,51,48,44,39,33,29].map((n,i)=>`<div class="clean-bar ${i===6?'alert':''}" style="height:${n*2}px"><b>${n}</b><span>${String(i+1).padStart(2,'0')}</span></div>`).join('')}</div></section><section class="evidence-card"><div class="war-card-head"><h2>为什么需要处理</h2><span>系统发现的关联信号</span></div><div class="evidence"><b>近 3 日日均出货额较前一周下降 24%</b><p>销售趋势异常，需确认是否存在交期或客户决策因素。</p></div><div class="evidence"><b>重点礼赠项目已 12 天无有效跟进</b><p>项目停滞与出货下降同时发生，应优先核验。</p></div></section></div>`};render();
</script>
